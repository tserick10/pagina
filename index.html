<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Una pregunta 🌅</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow:hidden;background:#120d1a;color:white}
.scene{
  position:relative;width:100%;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  background:#1a1020 url("atardecer.png") center/cover no-repeat;
}
.scene:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(9,8,20,.28),rgba(10,5,12,.38));
}
.sun-glow{
  position:absolute;width:180px;height:180px;border-radius:50%;
  right:8%;bottom:23%;background:rgba(255,184,65,.22);
  filter:blur(28px);animation:pulse 4s ease-in-out infinite;
}
.card{
  position:relative;z-index:2;width:min(88%,430px);padding:34px 25px 28px;
  text-align:center;border:1px solid rgba(255,255,255,.2);
  border-radius:28px;background:rgba(15,10,20,.35);
  backdrop-filter:blur(9px);box-shadow:0 20px 70px rgba(0,0,0,.35);
}
.kicker{font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
h1{font-size:clamp(2rem,9vw,3.2rem);line-height:1.05;margin:10px 0 14px}
p{font-size:1.1rem;margin:8px 0;opacity:.92}
.time{display:inline-block;margin:12px 0 22px;padding:8px 14px;border-radius:999px;
background:rgba(255,177,73,.18);border:1px solid rgba(255,210,130,.35);font-weight:700}
.buttons{display:flex;gap:12px;justify-content:center;align-items:center;min-height:64px}
button{
 border:0;border-radius:16px;padding:15px 24px;font-size:1.05rem;font-weight:800;
 cursor:pointer;transition:transform .28s ease,opacity .28s ease,filter .28s ease;
 touch-action:manipulation;
}
#yes{background:#fff;color:#21131a;box-shadow:0 8px 25px rgba(0,0,0,.2)}
#no{background:rgba(255,255,255,.14);color:white;border:1px solid rgba(255,255,255,.2)}
#message{min-height:26px;font-size:.9rem;opacity:.75;margin-top:15px}
.hidden{display:none!important}
.success h1{font-size:2.5rem}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;background:white;
animation:fall 2.8s linear forwards;opacity:.9}
.small{font-size:.92rem;opacity:.75;margin-top:15px}
@keyframes pulse{50%{transform:scale(1.15);opacity:.65}}
@keyframes fall{to{transform:translateY(110dvh) rotate(720deg);opacity:0}}
@media(max-width:420px){.card{padding:28px 19px}.buttons{gap:8px}button{padding:14px 18px}}
</style>
</head>
<body>
<div class="scene">
  <div class="sun-glow"></div>
  <div class="card" id="card">
    <div class="kicker">Para vos 👀</div>
    <h1>¿Vamos a ver el atardecer?</h1>
    <p>Mañana. Tú y yo.</p>
    <div class="time">🌅 4:00 PM</div>
    <div class="buttons">
      <button id="yes">Sí</button>
      <button id="no">No 👀</button>
    </div>
    <div id="message"></div>
  </div>
  <div class="confetti" id="confetti"></div>
</div>

<script>
const yes=document.getElementById('yes');
const no=document.getElementById('no');
const msg=document.getElementById('message');
const card=document.getElementById('card');
let noClicks=0;

const texts=[
  "¿Segura? 👀",
  "Piénsalo otra vez jajaja",
  "No te creo 😌",
  "Última oportunidad...",
  "Ese botón ya se está rindiendo 😂"
];

no.addEventListener('click',()=>{
  noClicks++;
  const scale=Math.max(.08,1-noClicks*.17);
  no.style.transform=`scale(${scale})`;
  yes.style.transform=`scale(${1+Math.min(noClicks*.06,.35)})`;
  msg.textContent=texts[Math.min(noClicks-1,texts.length-1)];
  if(noClicks>=5){
    no.style.opacity="0.15";
    no.style.pointerEvents="none";
    msg.textContent="Bueno... creo que el universo quiere que digas que sí 😂";
  }
});

yes.addEventListener('click',()=>{
  document.querySelector('.buttons').classList.add('hidden');
  card.classList.add('success');
  card.querySelector('.kicker').textContent="Plan confirmado ✅";
  card.querySelector('h1').textContent="Entonces nos vemos mañana";
  card.querySelector('p').textContent="Mañana a las 4:00 PM. Paso por ti.";
  card.querySelector('.time').textContent="🌅 Mañana · 4:00 PM · Paso por ti";
  msg.textContent="";
  for(let i=0;i<55;i++){
    const el=document.createElement('i');
    el.style.left=Math.random()*100+'%';
    el.style.animationDelay=(Math.random()*1.1)+'s';
    el.style.transform=`rotate(${Math.random()*360}deg)`;
    document.getElementById('confetti').appendChild(el);
  }
});
</script>
</body>
</html>
